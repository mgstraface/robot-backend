; Programa de PRUEBAS de hardware de Robi (protoboard). No es el firmware del robot.
; Abrí ESTA carpeta (firmware/pruebas/) en VS Code con PlatformIO y subilo con la flechita (Upload).
; Después abrí el Monitor Serie (115200) y escribí una letra + Enter. "h" muestra la ayuda.

[env:pruebas]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
