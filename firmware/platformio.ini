; Firmware de Robi para la Waveshare ESP32-S3-Touch-LCD-1.47 (ESP32-S3R8: 8 MB PSRAM octal, 16 MB flash).
; Abrí ESTA carpeta (firmware/) en VS Code con PlatformIO y tocá la flechita (Upload) de la barra de abajo.

[env:robi]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = particiones.csv
; las caras "filmadas" del panel (las genera robot-frontend/tools/caras/render.mjs)
board_build.embed_files = data/caras.bin

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  moononournation/GFX Library for Arduino @ 1.5.9
  links2004/WebSockets @ 2.6.1
  bblanchon/ArduinoJson @ 7.2.1
